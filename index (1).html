<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDWEAR — Custom Streetwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#090909;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
    --accent:#7c3aed;--accent2:#06b6d4;--accent3:#f59e0b;
    --text:#f0f0f0;--text2:#a0a0a0;--text3:#606060;
    --border:#2a2a2a;--border2:#333;
    --neon-purple:#a855f7;--neon-blue:#22d3ee;
    --danger:#ef4444;--success:#10b981;
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
  
  .mono{font-family:'Space Mono',monospace}
  .bebas{font-family:'Bebas Neue',cursive;letter-spacing:2px}
  
  /* Neon glow effects */
  .glow-purple{text-shadow:0 0 20px var(--neon-purple),0 0 40px var(--accent)}
  .glow-blue{text-shadow:0 0 20px var(--neon-blue),0 0 40px var(--accent2)}
  .btn-neon-purple{
    background:transparent;border:1px solid var(--accent);color:var(--neon-purple);
    padding:12px 28px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;position:relative;overflow:hidden;
    transition:all .3s ease;
  }
  .btn-neon-purple:hover{background:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent),0 0 40px var(--accent)}
  .btn-neon-blue{
    background:transparent;border:1px solid var(--accent2);color:var(--neon-blue);
    padding:12px 28px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;
    transition:all .3s ease;
  }
  .btn-neon-blue:hover{background:var(--accent2);color:#000;box-shadow:0 0 20px var(--accent2)}
  .btn-solid{
    background:var(--accent);border:none;color:#fff;
    padding:14px 32px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;
    transition:all .3s ease;
  }
  .btn-solid:hover{background:#6d28d9;box-shadow:0 0 30px var(--accent)}
  .btn-ghost{
    background:transparent;border:1px solid var(--border2);color:var(--text2);
    padding:10px 20px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:500;
    letter-spacing:1px;text-transform:uppercase;
    transition:all .3s ease;
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--neon-purple)}
  
  input,select,textarea{
    background:var(--bg3);border:1px solid var(--border);color:var(--text);
    padding:12px 16px;font-family:'Rajdhani',sans-serif;font-size:15px;
    width:100%;outline:none;transition:border .3s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(124,58,237,.2)}
  input::placeholder{color:var(--text3)}
  label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
  
  .card{background:var(--bg2);border:1px solid var(--border);padding:24px;transition:all .3s}
  .card:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(124,58,237,.1)}
  
  /* Nav */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    background:rgba(9,9,9,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:0 40px;height:64px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-logo{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:4px;cursor:pointer;
    background:linear-gradient(135deg,var(--neon-purple),var(--neon-blue));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .nav-links{display:flex;gap:32px;align-items:center}
  .nav-link{color:var(--text2);cursor:pointer;font-size:13px;letter-spacing:2px;text-transform:uppercase;
    transition:color .3s;font-weight:500}
  .nav-link:hover,.nav-link.active{color:var(--neon-purple)}
  .nav-actions{display:flex;gap:16px;align-items:center}
  .cart-btn{
    position:relative;background:transparent;border:1px solid var(--border2);
    color:var(--text);padding:8px 16px;cursor:pointer;font-family:'Rajdhani',sans-serif;
    font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:8px;
    transition:all .3s;
  }
  .cart-btn:hover{border-color:var(--accent);color:var(--neon-purple)}
  .cart-badge{
    position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;
    width:18px;height:18px;border-radius:50%;font-size:10px;
    display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  
  /* Sections */
  .section{padding:80px 40px;max-width:1400px;margin:0 auto}
  .section-title{font-family:'Bebas Neue',cursive;font-size:56px;letter-spacing:3px;margin-bottom:8px}
  .section-sub{color:var(--text2);font-size:15px;letter-spacing:2px;margin-bottom:48px;text-transform:uppercase}
  
  /* Tag */
  .tag{display:inline-block;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);
    color:var(--neon-purple);padding:4px 12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
  .tag-blue{background:rgba(6,182,212,.15);border-color:rgba(6,182,212,.3);color:var(--neon-blue)}
  
  /* Product card */
  .product-card{
    background:var(--bg2);border:1px solid var(--border);overflow:hidden;
    cursor:pointer;transition:all .4s ease;position:relative;
  }
  .product-card:hover{border-color:var(--accent);transform:translateY(-4px);
    box-shadow:0 20px 40px rgba(0,0,0,.5),0 0 20px rgba(124,58,237,.2)}
  .product-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
  .product-img-placeholder{
    width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:var(--bg3);font-size:80px;color:var(--text3);
  }
  .product-tshirt-wrap{
    width:100%;aspect-ratio:1;background:var(--bg3);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .product-tshirt-wrap svg{width:90%;height:90%;transition:transform .4s ease}
  .product-card:hover .product-tshirt-wrap svg{transform:scale(1.05) translateY(-4px)}
  .color-dots{display:flex;gap:8px;margin-bottom:12px}
  .color-dot{
    width:20px;height:20px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;transition:all .25s;flex-shrink:0;
  }
  .color-dot:hover,.color-dot.active{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
  .product-info{padding:16px}
  .product-name{font-size:16px;font-weight:700;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
  .product-price{color:var(--neon-purple);font-family:'Space Mono',monospace;font-size:15px}
  .product-badge{
    position:absolute;top:12px;left:12px;
    background:var(--accent);color:#fff;padding:4px 10px;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;font-weight:700;
  }
  
  /* Hero */
  .hero{
    min-height:100vh;display:flex;align-items:center;
    padding:120px 40px 80px;position:relative;overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;z-index:0;
    background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,.15) 0%,transparent 60%),
               radial-gradient(ellipse at 80% 20%,rgba(6,182,212,.1) 0%,transparent 50%);
  }
  .hero-grid{
    position:absolute;inset:0;z-index:0;opacity:.03;
    background-image:linear-gradient(var(--text3) 1px,transparent 1px),
                     linear-gradient(90deg,var(--text3) 1px,transparent 1px);
    background-size:40px 40px;
  }
  .hero-content{position:relative;z-index:1;max-width:700px}
  .hero-title{
    font-family:'Bebas Neue',cursive;font-size:clamp(72px,10vw,140px);
    line-height:.95;letter-spacing:4px;margin-bottom:24px;
    background:linear-gradient(135deg,#fff 0%,var(--neon-purple) 60%,var(--neon-blue) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero-sub{font-size:18px;color:var(--text2);max-width:480px;line-height:1.7;margin-bottom:40px;letter-spacing:.5px}
  .hero-btns{display:flex;gap:16px;flex-wrap:wrap}
  .hero-stats{display:flex;gap:48px;margin-top:64px;padding-top:48px;border-top:1px solid var(--border)}
  .stat-num{font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:2px;color:var(--neon-purple)}
  .stat-label{font-size:12px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
  
  /* Marquee */
  .marquee-wrap{overflow:hidden;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg2)}
  .marquee{display:flex;gap:64px;animation:marquee 20s linear infinite;white-space:nowrap}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .marquee-item{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:4px;color:var(--text3);display:flex;align-items:center;gap:64px}
  .marquee-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}
  
  /* Filter bar */
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
  .filter-btn{
    background:transparent;border:1px solid var(--border);color:var(--text2);
    padding:8px 16px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;transition:all .3s;
  }
  .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--neon-purple);background:rgba(124,58,237,.1)}
  
  /* Builder */
  .builder-wrap{padding-top:64px;min-height:100vh}
  .builder-progress{display:flex;gap:0;margin-bottom:48px;position:relative}
  .builder-progress::before{content:'';position:absolute;top:14px;left:0;right:0;height:1px;background:var(--border)}
  .progress-step{
    flex:1;text-align:center;position:relative;cursor:pointer;
  }
  .progress-dot{
    width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
    background:var(--bg);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;position:relative;z-index:1;transition:all .3s;
  }
  .progress-step.active .progress-dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .progress-step.done .progress-dot{border-color:var(--success);background:var(--success)}
  .progress-label{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
  .progress-step.active .progress-label{color:var(--neon-purple)}
  
  /* Cart */
  .cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;
    display:flex;justify-content:flex-end;
  }
  .cart-panel{
    width:420px;max-width:100%;background:var(--bg2);border-left:1px solid var(--border);
    height:100%;overflow-y:auto;padding:32px;
    animation:slideIn .3s ease;
  }
  @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  .cart-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
  .cart-item-img{width:72px;height:72px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
  
  /* Auth */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:100px 20px 40px;
  }
  .auth-card{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--border);padding:48px}
  .auth-title{font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:3px;margin-bottom:8px}
  .form-group{margin-bottom:20px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  
  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--bg2);border:1px solid var(--border);padding:40px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
  
  /* T-shirt canvas */
  .tshirt-canvas{
    width:100%;max-width:400px;margin:0 auto;
    aspect-ratio:1;background:var(--bg3);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;border:1px solid var(--border);
  }
  .tshirt-svg{width:100%;height:100%}
  
  /* Swatch */
  .swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .3s}
  .swatch:hover,.swatch.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.3)}
  
  /* Design tile */
  .design-tile{
    aspect-ratio:1;background:var(--bg3);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;transition:all .3s;font-size:32px;
  }
  .design-tile:hover,.design-tile.active{border-color:var(--accent);background:rgba(124,58,237,.1);
    box-shadow:0 0 16px rgba(124,58,237,.2)}
  .design-tile span{font-size:12px;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
  
  /* Gallery */
  .gallery-grid{columns:3;gap:12px}
  .gallery-item{break-inside:avoid;margin-bottom:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .3s}
  .gallery-item:hover{border-color:var(--accent);transform:scale(1.01)}
  .gallery-item img,.gallery-placeholder{width:100%;display:block}
  .gallery-placeholder{
    background:var(--bg3);aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text3)
  }
  
  /* WhatsApp */
  .whatsapp-btn{
    position:fixed;bottom:32px;right:32px;z-index:999;
    background:#25d366;color:#fff;border:none;
    width:56px;height:56px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 4px 20px rgba(37,211,102,.4);
    transition:all .3s;
  }
  .whatsapp-btn:hover{background:#128c7e;transform:scale(1.1);box-shadow:0 4px 30px rgba(37,211,102,.6)}
  
  /* Order summary */
  .order-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}
  .order-total{display:flex;justify-content:space-between;padding:16px 0;font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:2px}
  
  /* Responsive */
  @media(max-width:768px){
    nav{padding:0 20px}
    .nav-links{display:none}
    .section{padding:60px 20px}
    .hero{padding:100px 20px 60px}
    .section-title{font-size:40px}
    .gallery-grid{columns:2}
    .form-row{grid-template-columns:1fr}
    .auth-card{padding:32px 24px}
    .cart-panel{width:100%}
    .hero-stats{gap:24px}
  }
  
  /* Animations */
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .fade-up{animation:fadeUp .6s ease both}
  .fade-up-d1{animation-delay:.1s}
  .fade-up-d2{animation-delay:.2s}
  .fade-up-d3{animation-delay:.3s}
  .neon-pulse{animation:neonPulse 2s ease-in-out infinite}
  @keyframes neonPulse{0%,100%{box-shadow:0 0 8px var(--accent)}50%{box-shadow:0 0 24px var(--accent),0 0 48px var(--accent)}}
  
  /* Notification toast */
  .toast{
    position:fixed;bottom:100px;right:32px;z-index:5000;
    background:var(--bg2);border:1px solid var(--success);color:var(--text);
    padding:14px 24px;font-size:14px;letter-spacing:1px;
    animation:toastIn .3s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  
  /* Size selector */
  .size-btn{
    background:transparent;border:1px solid var(--border);color:var(--text2);
    padding:10px;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;
    min-width:48px;transition:all .3s;
  }
  .size-btn:hover,.size-btn.active{border-color:var(--accent);color:var(--neon-purple);background:rgba(124,58,237,.1)}

  /* Order page */
  .order-track{display:flex;gap:0;margin:32px 0}
  .track-step{flex:1;text-align:center;position:relative}
  .track-step::before{content:'';position:absolute;top:12px;left:50%;right:-50%;height:2px;background:var(--border)}
  .track-step:last-child::before{display:none}
  .track-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--bg);margin:0 auto 8px;position:relative;z-index:1}
  .track-step.done .track-dot{border-color:var(--success);background:var(--success)}
  .track-step.active .track-dot{border-color:var(--accent);background:var(--accent)}
  .track-label{font-size:10px;color:var(--text3);letter-spacing:1px}
  
  /* Page transitions */
  .page-enter{animation:fadeUp .4s ease}
</style>
</head>
<body>
<div id="root"></div>

// ─── Google Sheets integration (replace with your sheet URL) ─────────────────
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzkXhcDXrKoVKKNrZ7CIawJFHjtRFO46pDtCCl2S-pjNABMyq8oij8SDNogD_WMDVk/exec";

async function saveToSheet(data) {
  try {
    await fetch(SHEET_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    return true;
  } catch(e) {
    console.log("Sheet save (configure SHEET_URL):", e.message);
    return false;
  }
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t)},[]);
  return <div className="toast">✓ {msg}</div>;
}

// ─── Product T-Shirt SVG ──────────────────────────────────────────────────────
function ProductTshirtSVG({tshirtColor, print, size="card"}){
  const hex = tshirtColor || "#0d0d0d";
  const isLight = hex === "#e8e8e8";
  const ink = isLight ? "#111" : print?.color || "#a855f7";
  const glow = print?.glow || "rgba(168,85,247,.6)";
  const label = print?.text || "";
  const sub = print?.sub || "";

  // Fabric highlight — slightly lighter than body
  const lighten = (h, amt) => {
    const n = parseInt(h.replace("#",""),16);
    const r = Math.min(255,((n>>16)&0xff)+amt);
    const g = Math.min(255,((n>>8)&0xff)+amt);
    const b = Math.min(255,(n&0xff)+amt);
    return `rgb(${r},${g},${b})`;
  };
  const highlight = lighten(hex, 18);
  const shadow = "rgba(0,0,0,0.35)";

  return(
    <svg viewBox="0 0 260 280" xmlns="http://www.w3.org/2000/svg" style={{width:"100%",height:"100%",display:"block"}}>
      {/* Dark stage bg */}
      <rect width="260" height="280" fill="#0a0a0a"/>

      {/* Soft floor shadow */}
      <ellipse cx="130" cy="265" rx="78" ry="8" fill="rgba(0,0,0,.55)"/>

      {/* ── T-SHIRT BODY ── */}
      {/* Left sleeve */}
      <path d="M52 66 L22 52 L34 102 L40 108 L54 105 Z"
        fill={hex} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
      {/* sleeve inner shading */}
      <path d="M52 66 L34 102 L40 108 L54 105 Z" fill={shadow}/>

      {/* Right sleeve */}
      <path d="M208 66 L238 52 L226 102 L220 108 L206 105 Z"
        fill={hex} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
      {/* sleeve inner shading */}
      <path d="M208 66 L226 102 L220 108 L206 105 Z" fill={shadow}/>

      {/* Main body */}
      <path d="M52 66 L40 108 L72 104 L72 248 L188 248 L188 104 L220 108 L208 66 Z"
        fill={hex} stroke="rgba(255,255,255,.07)" strokeWidth="1"/>

      {/* Collar hole */}
      <path d="M96 66 Q130 50 164 66" fill="none"
        stroke={isLight ? "rgba(0,0,0,.2)" : "rgba(255,255,255,.18)"} strokeWidth="2"/>
      <path d="M96 66 Q130 86 164 66"
        fill={isLight ? "#d0d0d0" : "#050505"}
        stroke={isLight ? "rgba(0,0,0,.15)" : "rgba(255,255,255,.08)"} strokeWidth="1"/>

      {/* Side shading — left edge */}
      <path d="M72 104 L72 248 L92 248 L92 104 Z" fill="rgba(0,0,0,.18)"/>
      {/* Side shading — right edge */}
      <path d="M188 104 L168 104 L168 248 L188 248 Z" fill="rgba(0,0,0,.12)"/>

      {/* Center highlight seam */}
      <line x1="130" y1="84" x2="130" y2="248"
        stroke={isLight ? "rgba(0,0,0,.06)" : "rgba(255,255,255,.04)"}
        strokeWidth="1" strokeDasharray="3 6"/>

      {/* Shoulder highlight */}
      <path d="M72 104 Q130 96 188 104" fill="none"
        stroke={highlight} strokeWidth="1.5" strokeOpacity=".5"/>

      {/* ── PRINT DESIGN on chest ── */}
      {label && (
        <g style={{filter:`drop-shadow(0 0 6px ${glow})`}}>
          <text x="130" y="162" textAnchor="middle" dominantBaseline="middle"
            style={{
              fontFamily:"'Bebas Neue',cursive",
              fontSize: label.length > 5 ? 26 : 34,
              fill: ink,
              letterSpacing: 3,
            }}>
            {label}
          </text>
          {sub && (
            <text x="130" y="185" textAnchor="middle" dominantBaseline="middle"
              style={{
                fontFamily:"'Space Mono',monospace",
                fontSize:13,
                fill:ink,
                opacity:.7,
                letterSpacing:2,
              }}>
              {sub}
            </text>
          )}
        </g>
      )}
    </svg>
  );
}

// ─── Product Card ─────────────────────────────────────────────────────────────
function ProductCard({product,addToCart,delay=0}){
  const [added,setAdded]=useState(false);
  const [activeColorIdx,setActiveColorIdx]=useState(0);
  const activeColor=product.colorOptions?.[activeColorIdx]||{hex:"#0d0d0d",name:"Black"};

  const handle=e=>{
    e.stopPropagation();
    addToCart({
      ...product,
      size:"M",
      qty:1,
      selectedColor:activeColor.name,
      emoji:"👕",
    });
    setAdded(true);
    setTimeout(()=>setAdded(false),1500);
  };

  return(
    <div className="product-card fade-up" style={{animationDelay:`${delay}ms`}}>
      {product.badge&&<div className="product-badge">{product.badge}</div>}

      {/* T-shirt visual */}
      <div className="product-tshirt-wrap">
        <ProductTshirtSVG tshirtColor={activeColor.hex} print={product.print}/>
      </div>

      <div className="product-info">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
          <div className="product-name">{product.name}</div>
          <div className="product-price">${product.price}</div>
        </div>
        <div style={{fontSize:12,color:"var(--text3)",marginBottom:10,letterSpacing:1}}>{product.desc}</div>

        {/* Color switcher */}
        <div className="color-dots">
          {product.colorOptions?.map((c,i)=>(
            <div key={i} className={`color-dot${activeColorIdx===i?" active":""}`}
              style={{background:c.hex,borderColor:activeColorIdx===i?"#fff":"transparent"}}
              title={c.name}
              onClick={e=>{e.stopPropagation();setActiveColorIdx(i);}}
            />
          ))}
          <span style={{fontSize:11,color:"var(--text3)",letterSpacing:1,alignSelf:"center",marginLeft:4}}>
            {activeColor.name.toUpperCase()}
          </span>
        </div>

        <button
          className={added?"btn-solid":"btn-neon-purple"}
          style={{width:"100%",padding:"10px"}}
          onClick={handle}
        >{added?"✓ ADDED":"ADD TO CART"}</button>
      </div>
    </div>
  );
}

// ─── BUILDER ──────────────────────────────────────────────────────────────────
function Builder({addToCart,setPage,user}){
  const [step,setStep]=useState(1);
  const [config,setConfig]=useState({
    type:null,size:null,color:TSHIRT_COLORS[0],
    placement:"front",designCat:null,design:null,
    designSize:100,designRotation:0,designX:50,designY:50,
  });
  const [added,setAdded]=useState(false);

  const steps=["TYPE","SIZE","DESIGN","PLACEMENT","PREVIEW"];
  const canNext=()=>{
    if(step===1)return config.type&&config.size;
    if(step===2)return true;
    if(step===3)return config.designCat&&config.design;
    if(step===4)return true;
    return true;
  };

  const basePrice=75;
  const typeExtra=config.type?TSHIRT_TYPES.find(t=>t.id===config.type)?.price||0:0;
  const total=basePrice+typeExtra;

  const handleAdd=()=>{
    const item={
      id:"custom_"+Date.now(),
      name:"CUSTOM — "+config.design,
      price:total,
      qty:1,
      size:config.size,
      color:config.color.name,
      emoji:"🎨",
      custom:true,
      config:{...config},
    };
    addToCart(item);
    setAdded(true);
    setTimeout(()=>{setAdded(false);setPage("collections")},2000);
  };

  return(
    <div className="page-enter builder-wrap">
      <div className="section">
        <div className="tag">CUSTOM BUILDER</div>
        <h1 className="section-title">BUILD YOUR TEE</h1>

        {/* Progress */}
        <div className="builder-progress">
          {steps.map((s,i)=>(
            <div key={s} className={`progress-step${step===i+1?" active":step>i+1?" done":""}`}
              onClick={()=>step>i+1&&setStep(i+1)}>
              <div className="progress-dot">{step>i+1?"✓":i+1}</div>
              <div className="progress-label">{s}</div>
            </div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:48,alignItems:"start"}}>
          {/* Left: Options */}
          <div>
            {step===1&&<Step1 config={config} setConfig={setConfig}/>}
            {step===2&&<Step2 config={config} setConfig={setConfig}/>}
            {step===3&&<Step3 config={config} setConfig={setConfig}/>}
            {step===4&&<Step4 config={config} setConfig={setConfig}/>}
            {step===5&&<Step5 config={config} total={total} added={added} handleAdd={handleAdd}/>}
          </div>

          {/* Right: Live Preview */}

// ─── T-Shirt SVG Preview ──────────────────────────────────────────────────────
function TshirtPreview({config}){
  const hex = config.color?.hex || "#0d0d0d";
  const isLight = hex === "#e8e8e8";
  const design = config.design;
  const cat = DESIGN_CATS.find(d=>d.id===config.designCat);
  const catEmoji = cat?.emoji || "";
  const sizeFactor = (config.designSize||100)/100;
  const rot = config.designRotation||0;
  // design X/Y as % of the shirt body area (body goes roughly x:72-188, y:86-248 in 260-viewBox)
  const dx = 72 + ((config.designX||50)/100)*(188-72);
  const dy = 104 + ((config.designY||50)/100)*(248-104);
  const shadow = "rgba(0,0,0,0.35)";
  const lighten = (h, amt) => {
    const n = parseInt((h||"#0d0d0d").replace("#",""),16);
    const r=Math.min(255,((n>>16)&0xff)+amt);
    const g=Math.min(255,((n>>8)&0xff)+amt);
    const b=Math.min(255,(n&0xff)+amt);
    return `rgb(${r},${g},${b})`;
  };
  const highlight = lighten(hex, 22);
  // design ink color
  const catColor = config.designCat==="minimal"
    ? (isLight?"#222":"#e0e0e0")
    : config.designCat==="tech" ? "#22d3ee"
    : config.designCat==="quotes" ? "#fbbf24"
    : config.designCat==="abstract" ? "#e879f9"
    : "#a855f7";
  const inkColor = isLight ? "#111" : catColor;
  const glowColor = isLight ? "rgba(0,0,0,.3)" : catColor.replace(")",", .7)").replace("rgb","rgba");

  return(
    <div className="tshirt-canvas" style={{userSelect:"none"}}>
      <svg viewBox="0 0 260 290" xmlns="http://www.w3.org/2000/svg" style={{width:"100%",height:"100%",display:"block"}}>
        {/* Stage */}
        <rect width="260" height="290" fill="#080808"/>
        {/* Subtle grid */}
        <pattern id="pg" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0L0 0 0 20" fill="none" stroke="rgba(255,255,255,.03)" strokeWidth=".5"/>
        </pattern>
        <rect width="260" height="290" fill="url(#pg)"/>
        {/* Floor shadow */}
        <ellipse cx="130" cy="274" rx="72" ry="7" fill="rgba(0,0,0,.6)"/>

        {/* Left sleeve */}
        <path d="M52 66 L22 52 L34 102 L40 108 L54 105 Z"
          fill={hex} stroke="rgba(255,255,255,.07)" strokeWidth=".8"/>
        <path d="M44 80 L34 102 L40 108 L54 105 L52 66 Z" fill={shadow}/>

        {/* Right sleeve */}
        <path d="M208 66 L238 52 L226 102 L220 108 L206 105 Z"
          fill={hex} stroke="rgba(255,255,255,.07)" strokeWidth=".8"/>
        <path d="M216 80 L226 102 L220 108 L206 105 L208 66 Z" fill={shadow}/>

        {/* Body */}
        <path d="M52 66 L40 108 L72 104 L72 252 L188 252 L188 104 L220 108 L208 66 Z"
          fill={hex} stroke="rgba(255,255,255,.07)" strokeWidth=".8"/>

        {/* Collar arch */}
        <path d="M96 66 Q130 50 164 66" fill="none"
          stroke={isLight?"rgba(0,0,0,.18)":"rgba(255,255,255,.2)"} strokeWidth="1.5"/>
        <path d="M96 66 Q130 84 164 66"
          fill={isLight?"#ccc":"#050505"}
          stroke={isLight?"rgba(0,0,0,.12)":"rgba(255,255,255,.07)"} strokeWidth=".8"/>

        {/* Left body shadow */}
        <path d="M72 104 L72 252 L94 252 L94 104 Z" fill="rgba(0,0,0,.2)"/>
        {/* Right body shadow */}
        <path d="M188 104 L166 104 L166 252 L188 252 Z" fill="rgba(0,0,0,.14)"/>
        {/* Shoulder highlight */}
        <path d="M72 104 Q130 95 188 104" fill="none"
          stroke={highlight} strokeWidth="1.2" strokeOpacity=".45"/>
        {/* Center seam */}
        <line x1="130" y1="86" x2="130" y2="252"
          stroke={isLight?"rgba(0,0,0,.06)":"rgba(255,255,255,.04)"}
          strokeWidth=".8" strokeDasharray="3 7"/>

        {/* Neon accent stripe — base of collar */}
        {!isLight&&(
          <line x1="96" y1="67" x2="164" y2="67"
            stroke={inkColor} strokeWidth="1" strokeOpacity=".35"/>
        )}

        {/* ── DESIGN ── */}
        {design&&(
          <g transform={`translate(${dx},${dy}) rotate(${rot}) scale(${sizeFactor})`}
            style={{filter:`drop-shadow(0 0 7px ${glowColor})`}}>
            <text x="0" y="0" textAnchor="middle" dominantBaseline="middle"
              style={{
                fontFamily:"'Bebas Neue',cursive",
                fontSize: design.length>6 ? 18 : 24,
                fill:inkColor,
                letterSpacing:3,
              }}>
              {design.toUpperCase()}
            </text>
            {catEmoji&&(
              <text x="0" y="22" textAnchor="middle" dominantBaseline="middle"
                style={{fontSize:14,fill:inkColor,opacity:.8,fontFamily:"'Space Mono',monospace",letterSpacing:2}}>
                {catEmoji}
              </text>
            )}
            {/* Underline accent */}
            <line x1="-30" y1="30" x2="30" y2="30"
              stroke={inkColor} strokeWidth=".8" strokeOpacity=".4"/>
          </g>
        )}

        {/* Empty state hint */}
        {!design&&(
          <text x="130" y="178" textAnchor="middle" dominantBaseline="middle"
            style={{fontFamily:"'Rajdhani',sans-serif",fontSize:11,fill:"rgba(255,255,255,.15)",letterSpacing:3}}>
            YOUR DESIGN HERE
          </text>
        )}

        {/* Active neon frame */}
        {design&&<rect x="1" y="1" width="258" height="288" fill="none"
          stroke={inkColor} strokeWidth=".8" strokeOpacity=".25"/>}
      </svg>
    </div>
  );
}

function Login({setPage,setUser,setToast}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");

  const handle=e=>{
    e.preventDefault();
    const users=getUsers();

  return(

// ─── REGISTER ─────────────────────────────────────────────────────────────────
function Register({setPage,setUser,setToast}){
  const [form,setForm]=useState({name:"",email:"",phone:"",address:"",password:"",confirm:""});
  const [err,setErr]=useState("");
  const upd=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const handle=e=>{
    e.preventDefault();
    if(form.password!==form.confirm){setErr("Passwords don't match.");return;}
    if(form.password.length<6){setErr("Password must be at least 6 characters.");return;}
    const users=getUsers();
    if(users.find(u=>u.email===form.email)){setErr("Email already registered.");return;}
    const newUser={id:Date.now(),name:form.name,email:form.email,phone:form.phone,address:form.address,password:form.password};
    saveUser(newUser);
    setCurrentUser(newUser);setUser(newUser);
    saveToSheet({type:"user",...newUser,password:undefined});
    setToast("Welcome to VOIDWEAR, "+newUser.name.split(" ")[0]+"!");
    setPage("home");
  };

  return(
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="tag">JOIN THE VOID</div>
        <h1 className="auth-title">REGISTER</h1>
        <p style={{color:"var(--text3)",marginBottom:32,fontSize:13,letterSpacing:1}}>CREATE YOUR FREE ACCOUNT</p>
        {err&&<div style={{background:"rgba(239,68,68,.1)",border:"1px solid var(--danger)",color:"#fca5a5",padding:"10px 14px",marginBottom:20,fontSize:13,letterSpacing:1}}>{err}</div>}
        <form onSubmit={handle}>
          <div className="form-group">
            <label>Full Name</label>
            <input value={form.name} onChange={upd("name")} required placeholder="Your Name"/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Email</label>
              <input type="email" value={form.email} onChange={upd("email")} required placeholder="email@example.com"/>
            </div>
            <div className="form-group">
              <label>Phone</label>
              <input type="tel" value={form.phone} onChange={upd("phone")} placeholder="+20 10 xxxx xxxx"/>
            </div>
          </div>
          <div className="form-group">
            <label>Delivery Address</label>
            <input value={form.address} onChange={upd("address")} placeholder="Street, City, Country"/>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Password</label>
              <input type="password" value={form.password} onChange={upd("password")} required placeholder="Min 6 chars"/>
            </div>
            <div className="form-group">
              <label>Confirm Password</label>
              <input type="password" value={form.confirm} onChange={upd("confirm")} required placeholder="Repeat"/>
            </div>
          </div>
          <button type="submit" className="btn-solid" style={{width:"100%",marginTop:8}}>CREATE ACCOUNT →</button>
        </form>
        <div style={{marginTop:24,textAlign:"center",fontSize:13,color:"var(--text3)"}}>
          ALREADY HAVE AN ACCOUNT?{" "}
          <span style={{color:"var(--neon-purple)",cursor:"pointer",letterSpacing:1}} onClick={()=>setPage("login")}>
            LOG IN
          </span>
        </div>
      </div>
    </div>
  );
}

// ─── CHECKOUT ─────────────────────────────────────────────────────────────────
function Checkout({cart,setCart,user,setPage,setToast}){
  const [form,setForm]=useState({
    name:user?.name||"",email:user?.email||"",
    phone:user?.phone||"",address:user?.address||"",
    notes:"",
  });
  const [step,setStep]=useState(1);// 1=info, 2=confirm, 3=done
  const upd=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);

  const placeOrder=()=>{
    const order={
      id:"VW"+Date.now(),
      date:new Date().toISOString(),
      customer:form,
      items:cart,
      total,
      status:"confirmed",
    };
    saveOrder(order);
    saveToSheet({type:"order",...order,items:JSON.stringify(order.items)});
    setCart([]);
    setStep(3);

          Your order is confirmed and being processed. You'll receive updates via WhatsApp.

        <div style={{background:"var(--bg2)",border:"1px solid var(--border)",padding:24,marginBottom:32,textAlign:"left"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{color:"var(--text3)",letterSpacing:1,fontSize:12}}>ORDER ID</span>
            <span className="mono" style={{color:"var(--neon-purple)",fontSize:12}}>VW{Date.now().toString().slice(-6)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between"}}>

          </div>
        </div>
        <button className="btn-solid" style={{marginRight:12}} onClick={()=>setPage("home")}>BACK TO HOME</button>
        <button className="btn-neon-purple" onClick={()=>setPage("collections")}>KEEP SHOPPING</button>
      </div>
    </div>
  );

  return(
    <div className="page-enter" style={{paddingTop:64}}>
      <div className="section" style={{maxWidth:900}}>
        <div className="tag">CHECKOUT</div>
        <h1 className="section-title">COMPLETE ORDER</h1>
        <div style={{display:"grid",gridTemplateColumns:"1fr 380px",gap:48,alignItems:"start"}}>
          {/* Form */}
          <div>
            {step===1&&(
              <div>
                <h3 style={{fontSize:18,letterSpacing:2,marginBottom:24,textTransform:"uppercase"}}>Delivery Information</h3>
                <div className="form-group">
                  <label>Full Name</label>
                  <input value={form.name} onChange={upd("name")} required placeholder="Your full name"/>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label>Email</label>
                    <input type="email" value={form.email} onChange={upd("email")} required placeholder="email@example.com"/>
                  </div>
                  <div className="form-group">
                    <label>Phone / WhatsApp</label>
                    <input value={form.phone} onChange={upd("phone")} required placeholder="+20 xxx xxxx"/>
                  </div>
                </div>
                <div className="form-group">
                  <label>Delivery Address</label>
                  <textarea value={form.address} onChange={upd("address")} rows={3} required placeholder="Full address including city and country" style={{resize:"vertical"}}/>
                </div>
                <div className="form-group">
                  <label>Order Notes (optional)</label>
                  <input value={form.notes} onChange={upd("notes")} placeholder="Special instructions..."/>
                </div>
                <button className="btn-solid" style={{width:"100%"}} onClick={()=>setStep(2)}>
                  REVIEW ORDER →
                </button>
              </div>
            )}
            {step===2&&(
              <div>
                <h3 style={{fontSize:18,letterSpacing:2,marginBottom:24,textTransform:"uppercase"}}>Confirm Your Order</h3>
                {[["NAME",form.name],["EMAIL",form.email],["PHONE",form.phone],["ADDRESS",form.address]].map(([k,v])=>(
                  <div key={k} className="order-row">
                    <span style={{color:"var(--text3)",letterSpacing:1,fontSize:12}}>{k}</span>
                    <span style={{fontSize:14,maxWidth:"60%",textAlign:"right"}}>{v||"—"}</span>
                  </div>
                ))}
                <div style={{display:"flex",gap:12,marginTop:24}}>
                  <button className="btn-ghost" style={{flex:1}} onClick={()=>setStep(1)}>← EDIT</button>
                  <button className="btn-solid" style={{flex:2}} onClick={placeOrder}>✓ PLACE ORDER</button>
                </div>
              </div>
            )}
          </div>

          {/* Order summary */}
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",padding:24,position:"sticky",top:100}}>
            <h3 style={{fontSize:16,letterSpacing:2,marginBottom:20,textTransform:"uppercase"}}>Order Summary</h3>
            {cart.map(item=>(
              <div key={item.id} style={{display:"flex",gap:12,paddingBottom:12,marginBottom:12,borderBottom:"1px solid var(--border)"}}>
                <div style={{width:48,height:48,background:"var(--bg3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{item.emoji||"👕"}</div>
                <div style={{flex:1,fontSize:13}}>
                  <div style={{fontWeight:700,letterSpacing:1,marginBottom:2}}>{item.name}</div>
                  <div style={{color:"var(--text3)"}}>QTY: {item.qty} · SIZE: {item.size||"M"}</div>
                </div>
                <div className="mono" style={{color:"var(--neon-purple)",fontSize:13}}>${(item.price*item.qty).toFixed(0)}</div>
              </div>
            ))}
            <div className="order-total">
              <span>TOTAL</span>
              <span style={{color:"var(--neon-purple)"}}>${total.toFixed(0)}</span>
            </div>
            <div style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textAlign:"center",paddingTop:12,borderTop:"1px solid var(--border)"}}>
              FREE SHIPPING · CASH ON DELIVERY AVAILABLE
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("home");
  const [cart,setCart]=useState([]);
  const [cartOpen,setCartOpen]=useState(false);
  const [user,setUser]=useState(getCurrentUser());
  const [toast,setToast]=useState(null);

  const addToCart=item=>{
    setCart(c=>{
      const ex=c.find(i=>i.id===item.id&&i.size===item.size);
      if(ex)return c.map(i=>i.id===item.id&&i.size===item.size?{...i,qty:i.qty+1}:i);
      return[...c,{...item,qty:1}];
    });
    setToast(item.name+" added to cart!");
  };

  return(
    <>
      <Nav page={page} setPage={setPage} cart={cart} user={user} setUser={setUser} onCartOpen={()=>setCartOpen(true)}/>
      
      {page==="home"&&<Home setPage={setPage} addToCart={addToCart}/>}
      {page==="collections"&&<Collections addToCart={addToCart}/>}
      {page==="builder"&&<Builder addToCart={addToCart} setPage={setPage} user={user}/>}
      {page==="gallery"&&<Gallery setPage={setPage}/>}
      {page==="login"&&<Login setPage={setPage} setUser={setUser} setToast={setToast}/>}
      {page==="register"&&<Register setPage={setPage} setUser={setUser} setToast={setToast}/>}
      {page==="checkout"&&<Checkout cart={cart} setCart={setCart} user={user} setPage={setPage} setToast={setToast}/>}

      {cartOpen&&<CartPanel cart={cart} setCart={setCart} onClose={()=>setCartOpen(false)} setPage={setPage} user={user}/>}
      <WhatsApp/>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
